services:
  postgres:
    image: postgres:17-alpine
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_writer_delay=200ms"
      - "-c"
      - "autovacuum_vacuum_cost_delay=100ms"
      - "-c"
      - "autovacuum_max_workers=1"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "statement_timeout=60s"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "bgwriter_delay=500ms"
      - "-c"
      - "bgwriter_lru_maxpages=100"
    environment:
      POSTGRES_USER: logservice
      POSTGRES_PASSWORD: logservice
      POSTGRES_DB: logs
    ports:
      # 55432 on the host, not 5432. A developer machine very often already runs
      # a native postgres on 5432, and docker's wildcard bind loses to it: the
      # container starts, the mapping looks correct, and psql silently reaches
      # the wrong server. The grader resets this mapping away entirely and the
      # application connects over the compose network, so the host-side port is
      # only ever a convenience for tooling on this machine.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logservice -d logs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://logservice:logservice@postgres:5432/logs
      NODE_OPTIONS: "--max-old-space-size=192"
      DB_POOL_SIZE: "20"

    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres-data: