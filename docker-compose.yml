services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logservice
      POSTGRES_PASSWORD: logservice
      POSTGRES_DB: logs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logservice -d logs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://logservice:logservice@postgres:5432/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  postgres-data: